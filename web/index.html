<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binary Visualizer</title>
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #1a1a1a;
    --border: #333;
    --text: #e0e0e0;
    --dim: #888;
    --accent: #6cf;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    color: var(--dim);
    font-size: 0.85rem;
    margin-bottom: 1.5rem;
  }

  /* Drop zone */
  #drop-zone {
    width: 100%;
    max-width: 540px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  #drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(102, 204, 255, 0.05);
  }
  #drop-zone p { color: var(--dim); font-size: 0.9rem; }
  #drop-zone .cta {
    display: inline-block;
    margin-top: 0.75rem;
    padding: 0.5rem 1.25rem;
    background: var(--accent);
    color: #000;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.85rem;
  }
  #file-input { display: none; }

  /* Controls */
  .controls {
    display: flex;
    gap: 1rem;
    align-items: center;
    margin-top: 1.25rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .controls label { font-size: 0.8rem; color: var(--dim); }
  .controls select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.3rem 0.5rem;
    font-size: 0.85rem;
  }

  /* Stats */
  #stats {
    font-size: 0.8rem;
    color: var(--dim);
    margin-top: 0.75rem;
    text-align: center;
  }

  /* Canvas area */
  #canvas-wrap {
    margin-top: 1.5rem;
    display: none;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    border: 1px solid var(--border);
    border-radius: 4px;
    image-rendering: pixelated;
    width: 512px;
    height: 512px;
  }
  .axis-label {
    font-size: 0.75rem;
    color: var(--dim);
    margin-top: 0.4rem;
  }

  /* Loading indicator */
  #loading {
    display: none;
    margin-top: 1rem;
    color: var(--dim);
    font-size: 0.85rem;
  }

  /* WASM load error */
  #wasm-error {
    display: none;
    margin-top: 1rem;
    padding: 1rem;
    background: #2a1515;
    border: 1px solid #5a2020;
    border-radius: 8px;
    color: #f88;
    font-size: 0.85rem;
    max-width: 540px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Binary Visualizer</h1>
<p class="subtitle">Upload any file to see its byte-pair frequency heatmap</p>

<div id="wasm-error">
  Failed to load the WASM module. Make sure you built it with
  <code>make wasm</code> and are serving this page over HTTP.
</div>

<div id="drop-zone">
  <p>Drag &amp; drop a file here</p>
  <span class="cta">Choose file</span>
  <input type="file" id="file-input">
</div>

<div class="controls">
  <label for="scale-select">Tone mapping</label>
  <select id="scale-select">
    <option value="0" selected>Logarithmic</option>
    <option value="1">Square root</option>
    <option value="2">Linear</option>
  </select>
</div>

<div id="loading">Processing...</div>
<div id="stats"></div>

<div id="canvas-wrap">
  <canvas id="viz" width="256" height="256"></canvas>
  <span class="axis-label">X: first byte &nbsp; Y: second byte &nbsp; Brightness: frequency</span>
</div>

<script type="module">
  import init, { visualize, file_stats } from "./pkg/binary_visualizer_wasm.js";

  const dropZone    = document.getElementById("drop-zone");
  const fileInput   = document.getElementById("file-input");
  const scaleSelect = document.getElementById("scale-select");
  const loading     = document.getElementById("loading");
  const statsEl     = document.getElementById("stats");
  const canvasWrap  = document.getElementById("canvas-wrap");
  const canvas      = document.getElementById("viz");
  const ctx         = canvas.getContext("2d");
  const wasmError   = document.getElementById("wasm-error");

  let currentBytes = null;
  let wasmReady = false;

  // Initialise WASM
  try {
    await init();
    wasmReady = true;
  } catch (e) {
    console.error("WASM init failed:", e);
    wasmError.style.display = "block";
  }

  // --- File handling ---
  function handleFile(file) {
    if (!wasmReady) return;
    loading.style.display = "block";
    statsEl.textContent = "";

    const reader = new FileReader();
    reader.onload = () => {
      currentBytes = new Uint8Array(reader.result);
      render();
      loading.style.display = "none";

      // Show stats
      const s = file_stats(currentBytes);
      const fmt = (n) => n.toLocaleString();
      statsEl.textContent =
        `${file.name}  —  ${fmt(s[0])} bytes  ·  ${fmt(s[1])} unique pairs  ·  max count ${fmt(s[2])}`;
    };
    reader.readAsArrayBuffer(file);
  }

  function render() {
    if (!currentBytes) return;
    const scale = parseInt(scaleSelect.value, 10);
    const rgba = visualize(currentBytes, scale);
    const imageData = new ImageData(new Uint8ClampedArray(rgba.buffer, rgba.byteOffset, rgba.byteLength), 256, 256);
    ctx.putImageData(imageData, 0, 0);
    canvasWrap.style.display = "flex";
  }

  // Re-render when tone mapping changes
  scaleSelect.addEventListener("change", render);

  // Click to pick file
  dropZone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  // Drag & drop
  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("drag-over");
  });
  dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("drag-over");
  });
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
</script>
</body>
</html>
